<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - FAST BAZAAR</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" type="image/png" href="logo.png" />
</head>

<body>

    <header class="site-header">
        <div class="header-row">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Fast Bazaar Logo" class="logo" />
                <div class="brand-text">
                    <span class="brand-name">FAST BAZAAR</span>
                    <span class="tagline">Deal Bana</span>
                </div>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
            <nav class="main-nav" id="mainNav">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="admin.html">Admin</a>
                <a href="sell.html" class="nav-cta">Sell Item</a>
            </nav>
        </div>
    </header>

    <section class="section">
        <div class="section-head">
            <div>
                <span class="kicker">the full board</span>
                <h2>Available Products</h2>
            </div>
        </div>

        <p class="note" style="display:block; max-width:1180px; margin:0 auto 20px; text-align:center;">
            Only for FAST Faisalabad students. Message the seller directly, or request it through our team.
        </p>

        <div class="toolbar">
            <div class="search-box">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search by name or description…" />
            </div>
            <select id="sortSelect" class="sort-select">
                <option value="default">Sort: Newest</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A–Z</option>
            </select>
        </div>
        <p class="result-count" id="resultCount"></p>

        <div class="product-container" id="productContainer">
            <!-- Products loaded from API -->
        </div>
    </section>

    <footer class="site-footer">
        <div class="footer-bottom">&copy; 2026 FAST BAZAAR. All rights reserved.</div>
    </footer>

    <!-- Team request modal -->
    <div id="requestModal" class="request-modal hidden">
        <div class="request-modal-card">
            <button class="modal-close" onclick="closeRequestModal()">×</button>
            <h3 id="requestModalTitle">Request via Team</h3>
            <p class="sub" id="requestModalSub"></p>

            <label for="reqName">Your Name</label>
            <input type="text" id="reqName" placeholder="e.g. Zainab BSCS-2A" />

            <label for="reqPhone">Your WhatsApp Number</label>
            <input type="text" id="reqPhone" placeholder="923XXXXXXXXX" />

            <label for="reqQty">Quantity</label>
            <input type="number" id="reqQty" value="1" min="1" />

            <p class="commission-note" id="commissionNote"></p>

            <button class="btn btn-primary" onclick="submitRequest()">Send Request</button>
            <p class="form-msg" id="requestMsg"></p>
        </div>
    </div>

    <script>
        var allProducts = [];
        var activeRequestProductId = null;
        var COMMISSION_RATE_DISPLAY = 8; // matches server default; purely informational

        document.addEventListener('DOMContentLoaded', function () {
            var toggle = document.getElementById('navToggle');
            var nav = document.getElementById('mainNav');
            toggle.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });

            loadProducts();

            document.getElementById('searchInput').addEventListener('input', renderProducts);
            document.getElementById('sortSelect').addEventListener('change', renderProducts);
        });

        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function loadProducts() {
            fetch('/api/products')
                .then(function (response) { return response.json(); })
                .then(function (products) {
                    allProducts = products || [];
                    renderProducts();
                })
                .catch(function (error) {
                    console.error('Error loading products:', error);
                    document.getElementById('productContainer').innerHTML =
                        '<p class="no-products">Error loading products.</p>';
                });
        }

        function renderProducts() {
            var container = document.getElementById('productContainer');
            var resultCount = document.getElementById('resultCount');
            var query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
            var sortBy = document.getElementById('sortSelect').value;

            var list = allProducts.filter(function (p) {
                if (!query) return true;
                var haystack = ((p.name || '') + ' ' + (p.description || '')).toLowerCase();
                return haystack.indexOf(query) !== -1;
            });

            if (sortBy === 'price-asc') list = list.slice().sort(function (a, b) { return (a.price || 0) - (b.price || 0); });
            else if (sortBy === 'price-desc') list = list.slice().sort(function (a, b) { return (b.price || 0) - (a.price || 0); });
            else if (sortBy === 'name-asc') list = list.slice().sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

            resultCount.textContent = allProducts.length === 0 ? '' :
                (list.length + ' item' + (list.length === 1 ? '' : 's') + (query ? ' matching “' + query + '”' : ''));

            if (list.length === 0) {
                container.innerHTML = allProducts.length === 0
                    ? '<p class="no-products">No products available right now. Contact the team to list your item.</p>'
                    : '<p class="no-products">No items match your search.</p>';
                return;
            }

            var html = '';
            for (var i = 0; i < list.length; i++) {
                var product = list[i];
                var imagesArr = product.images || [];
                var thumb = imagesArr.length ? imagesArr[0] : '';
                var imagesData = encodeURIComponent(JSON.stringify(imagesArr));
                var dealType = product.deal_type || 'direct';

                html += '<div class="product-card" data-images="' + imagesData + '">';
                html += '<div class="price-tag">Rs ' + product.price + '</div>';
                html += '<img src="' + thumb + '" alt="' + escapeHtml(product.name) + '" onclick="openGalleryFromCard(this)" />';

                if (dealType === 'direct') html += '<span class="deal-badge direct">Direct Deal</span>';
                else if (dealType === 'team') html += '<span class="deal-badge team">Through Team</span>';
                else html += '<span class="deal-badge both">Direct or Team</span>';

                html += '<div class="card-body">';
                html += '<h3>' + escapeHtml(product.name) + '</h3>';
                html += '<p class="meta-row"><strong>Seller:</strong> ' + escapeHtml(product.sellerName || 'N/A') + '</p>';

                if (product.description) {
                    html += '<p class="description">' + escapeHtml(product.description) + '</p>';
                }
                html += '</div>';

                if (imagesArr.length > 1) {
                    html += '<div class="thumb-row">';
                    for (var t = 0; t < Math.min(imagesArr.length, 3); t++) {
                        html += '<img class="thumb" src="' + imagesArr[t] + '" data-index="' + t + '" onclick="openGalleryFromCard(this)" alt="thumb">';
                    }
                    html += '</div>';
                }

                html += '<p class="warning">Verify item before buying.</p>';

                if ((dealType === 'direct' || dealType === 'both') && product.sellerPhone) {
                    html += '<a href="https://wa.me/' + product.sellerPhone + '" target="_blank" class="contact-btn whatsapp">Message on WhatsApp</a>';
                }
                if (dealType === 'team' || dealType === 'both') {
                    html += '<button class="contact-btn" style="border:none; width:calc(100% - 32px); cursor:pointer;" onclick="openRequestModal(\'' + product.id + '\', \'' + escapeHtml(product.name).replace(/'/g, "\\'") + '\', ' + product.price + ')">Request via Team</button>';
                }
                if (dealType === 'direct' && !product.sellerPhone) {
                    html += '<a href="contact.html" class="contact-btn">Contact Team</a>';
                }

                html += '</div>';
            }

            container.innerHTML = html;
        }

        // ----- Team request modal -----
        function openRequestModal(productId, productName, price) {
            activeRequestProductId = productId;
            document.getElementById('requestModalSub').textContent = productName + ' — Rs ' + price;
            document.getElementById('reqName').value = '';
            document.getElementById('reqPhone').value = '';
            document.getElementById('reqQty').value = 1;
            document.getElementById('requestMsg').textContent = '';
            updateCommissionNote(price, 1);
            document.getElementById('reqQty').oninput = function () {
                updateCommissionNote(price, parseInt(this.value) || 1);
            };
            document.getElementById('requestModal').classList.remove('hidden');
        }

        function updateCommissionNote(price, qty) {
            var commission = Math.round(price * qty * (COMMISSION_RATE_DISPLAY / 100));
            document.getElementById('commissionNote').textContent =
                'A small team service fee (~Rs ' + commission + ') applies to team-mediated deals — it\'s added when the deal is finalized, not charged now.';
        }

        function closeRequestModal() {
            document.getElementById('requestModal').classList.add('hidden');
            activeRequestProductId = null;
        }

        function submitRequest() {
            var name = document.getElementById('reqName').value.trim();
            var phone = document.getElementById('reqPhone').value.trim();
            var qty = parseInt(document.getElementById('reqQty').value) || 1;
            var msg = document.getElementById('requestMsg');

            if (!name || !phone) {
                msg.textContent = 'Please fill your name and WhatsApp number.';
                msg.className = 'form-msg error';
                return;
            }

            fetch('/api/sales', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    productId: activeRequestProductId,
                    quantity: qty,
                    buyerName: name,
                    buyerPhone: phone,
                    dealType: 'team'
                })
            })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.error) {
                    msg.textContent = data.error;
                    msg.className = 'form-msg error';
                    return;
                }
                msg.textContent = 'Request sent! Our team will WhatsApp you shortly.';
                msg.className = 'form-msg success';
                loadProducts();
                setTimeout(closeRequestModal, 1800);
            })
            .catch(function (err) {
                console.error(err);
                msg.textContent = 'Something went wrong. Try again.';
                msg.className = 'form-msg error';
            });
        }

        // ----- Gallery logic -----
        var galleryState = { images: [], index: 0 };

        function openGalleryFromCard(el) {
            var card = el.closest('.product-card');
            if (!card) return;
            var images = [];
            try {
                images = JSON.parse(decodeURIComponent(card.dataset.images || '[]'));
            } catch (e) { images = []; }

            var startIndex = 0;
            if (el.dataset && el.dataset.index) startIndex = parseInt(el.dataset.index);
            else {
                var src = el.src || el.getAttribute('src') || '';
                startIndex = images.indexOf(src);
                if (startIndex === -1) startIndex = 0;
            }

            showGallery(images, startIndex);
        }

        function showGallery(images, index) {
            galleryState.images = images || [];
            galleryState.index = index || 0;
            var modal = document.getElementById('galleryModal');
            var img = document.getElementById('galleryImage');
            if (!modal || !img) return;
            img.src = galleryState.images[galleryState.index] || '';
            modal.classList.remove('hidden');
        }

        function closeGallery() { var modal = document.getElementById('galleryModal'); if (modal) modal.classList.add('hidden'); }
        function prevImage() { if (!galleryState.images.length) return; galleryState.index = (galleryState.index - 1 + galleryState.images.length) % galleryState.images.length; document.getElementById('galleryImage').src = galleryState.images[galleryState.index]; }
        function nextImage() { if (!galleryState.images.length) return; galleryState.index = (galleryState.index + 1) % galleryState.images.length; document.getElementById('galleryImage').src = galleryState.images[galleryState.index]; }

        document.addEventListener('keydown', function (e) {
            var modal = document.getElementById('galleryModal');
            if (modal && !modal.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'Escape') closeGallery();
            }
            var reqModal = document.getElementById('requestModal');
            if (e.key === 'Escape' && reqModal && !reqModal.classList.contains('hidden')) closeRequestModal();
        });

        (function () {
            var startX = 0;
            var modal = document.getElementById('galleryModal');
            document.addEventListener('touchstart', function (e) {
                if (!modal || modal.classList.contains('hidden')) return;
                startX = e.touches[0].clientX;
            });
            document.addEventListener('touchend', function (e) {
                if (!modal || modal.classList.contains('hidden')) return;
                var endX = e.changedTouches[0].clientX;
                var diff = endX - startX;
                if (Math.abs(diff) > 40) { if (diff > 0) prevImage(); else nextImage(); }
            });
        })();
    </script>

    <!-- Gallery modal -->
    <div id="galleryModal" class="gallery-modal hidden">
        <button class="close-btn" onclick="closeGallery()">×</button>
        <img id="galleryImage" class="gallery-img" src="" alt="gallery image" />
        <div class="gallery-controls">
            <button onclick="prevImage()">‹</button>
            <button onclick="nextImage()">›</button>
        </div>
    </div>

</body>

</html>
